name: Daily Heartbeat Committer

on:
  schedule:
    # Runs twice every day (at 04:35 UTC and 16:35 UTC)
    # Fully automated in the GitHub cloud 24/7/365
    # Even if your computer is completely turned off or you are offline!
    - cron: '35 4,16 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime from GitHub

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Daily Heartbeat Commit
        run: |
          git config --global user.name "Vansh pratap"
          git config --global user.email "vanshpratap2323@gmail.com"
          python commit_maker.py daily --count 1

      - name: Push Heartbeat to GitHub
        run: |
          git pull origin main --rebase
          git push origin main
